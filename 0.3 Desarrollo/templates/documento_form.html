{% extends 'base.html' %}{% block title %}Editar documento · Portal{% endblock %}
{% block content %}<section class="panel form-card"><h1>Editar documento</h1><form method="post"><label>Título<input name="titulo" required value="{{ documento['titulo'] }}"></label><label>Categoría<select name="categoria">{% for categoria in categorias %}<option {% if categoria == documento['categoria'] %}selected{% endif %}>{{ categoria }}</option>{% endfor %}</select></label><label>Descripción<textarea name="descripcion" rows="4">{{ documento['descripcion'] }}</textarea></label><button class="primary">Guardar</button> <a class="button" href="{{ url_for('detalle_repositorio', repositorio_id=documento['repositorio_id']) }}">Cancelar</a></form></section>{% endblock %}
